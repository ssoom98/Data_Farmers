# 대체재 추천 규칙 (강화판)
rules:
  # base 대비 최소 절감율(0.15 = 15% 이상 저렴한 후보만)
  price_discount_threshold: 0.15
  # 후보 Top-K 개수
  top_k: 5

# 실제 데이터의 품목명이 다를 때 표준명으로 치환
# 왼쪽(원본) → 오른쪽(표준)
aliases:
  # ── 일반 표기/오타/공백 보정 ───────────────────────────────
  "뉴그린": "뉴그린(브로콜리)"
  "브로코리(국산)": "브로콜리(국산)"
  "브로콜리": "브로콜리(국산)"          # 데이터가 국산만 있는 경우를 가정
  "취청(오이)": "취청"
  "쥬키니 호박": "쥬키니호박"
  "주키니호박": "쥬키니호박"
  "일반부추": "부추(일반)"
  "영양 부추": "영양부추"
  "치콘": "치콘(상추같이 생김)"
  "레드 치커리": "레드치커리"
  "자주 양파": "자주양파"
  "만생 양파": "만생양파"
  "깐 쪽파": "깐쪽파"
  "포장 쪽파": "포장쪽파"
  "대 추방울": "대추방울"
  "방울 토마토": "방울토마토"
  "완숙 토마토": "완숙토마토"
  "토마토": "토마토(일반)"
  "당근": "당근(일반)"
  "양배추": "양배추(일반)"
  "양상추": "양상추(일반)"
  "적채": "적채(일반)"
  "치커리": "치커리(일반)"
  "깻잎": "깻잎(일반)"
  "시금치": "시금치(일반)"
  "미나리": "미나리(일반)"
  "대파": "대파(일반)"
  "홍고추": "홍고추(일반)"
  "청초": "청초(일반)"

  # ── 버섯류 흔한 표기 ───────────────────────────────────────
  "양송이버섯(일반)": "양송이(일반)"
  "새송이버섯(일반)": "새송이(일반)"
  "느타리": "느타리버섯(일반)"
  "팽이버섯": "팽이"
  "표고": "표고버섯(일반)"

  # ── 마늘 계열(데이터가 섞여 들어오는 경우) ───────────────
  "깐마늘": "마늘"
  "다진마늘": "마늘"

  # ── 파프리카/피망 계열(색 미지정 보정, 필요 시 조정) ─────
  # 데이터에 '파프리카' 단독이 들어오면 녹색으로 귀속(정책에 맞게 변경 가능)
  "파프리카": "녹색파프리카"

